name: Build

on:
  push:
    # Änderungen nur am Windows-Tool bauen die APK nicht neu.
    paths-ignore:
      - 'ramwaechter/**'
      - '.github/workflows/ramwaechter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laermwaechter-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        # bei vorübergehenden Serverfehlern (z. B. 429) einmal neu versuchen
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease || (sleep 60 && ./gradlew testDebugUnitTest assembleRelease)
          cp app/build/outputs/apk/release/app-release.apk Laermwaechter.apk

      - name: APK prüfen
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify Laermwaechter.apk
          "$BT/aapt2" dump badging Laermwaechter.apk | head -1

      - name: Als Release veröffentlichen (fester Download-Link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Lärmwächter – Android (Build ${{ github.run_number }})"
          NOTES="Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Auf dem Handy Laermwaechter.apk herunterladen und öffnen. Neue Versionen lassen sich über die alte installieren."
          if gh release view laermwaechter-latest >/dev/null 2>&1; then
            # Datei austauschen statt Release zu löschen: der Link bleibt gültig
            gh release upload laermwaechter-latest Laermwaechter.apk --clobber
            gh release edit laermwaechter-latest --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create laermwaechter-latest Laermwaechter.apk --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES" --prerelease
          fi
