name: APK bauen

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk KlarTastatur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KlarTastatur
          path: KlarTastatur.apk

      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version KlarTastatur.apk \
            --title "KlarTastatur – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Auf dem Handy KlarTastatur.apk herunterladen und öffnen." \
            --target "${GITHUB_SHA}" --prerelease
