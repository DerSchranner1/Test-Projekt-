name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Web-App in Android-Projekt verpacken
        run: |
          npm ci
          npm run android:prepare
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: APK bauen
        working-directory: android
        # bei vorübergehenden Serverfehlern (z. B. 429) einmal neu versuchen
        run: ./gradlew assembleRelease --no-daemon || (sleep 60 && ./gradlew assembleRelease --no-daemon)

      - name: APK benennen
        run: cp android/app/build/outputs/apk/release/app-release.apk narrhalla-player.apk

      - name: APK prüfen (Signatur und Ausrichtung)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -c -P 16 -v 4 narrhalla-player.apk | tail -1
          "$BT/apksigner" verify --verbose narrhalla-player.apk
          "$BT/aapt2" dump badging narrhalla-player.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: narrhalla-player-apk
          path: narrhalla-player.apk

      - name: Als Release veröffentlichen (fester Download-Link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Automatisch gebaute APK (Build ${{ github.run_number }}). Neue Versionen lassen sich über die alte installieren – Titel, Marker und Einstellungen bleiben erhalten."
          if gh release view apk-latest >/dev/null 2>&1; then
            # Datei austauschen statt Release zu löschen: der Link bleibt durchgehend gültig
            gh release upload apk-latest narrhalla-player.apk --clobber
            gh release edit apk-latest --title "Narrhalla Player – Android (Build ${{ github.run_number }})" --notes "$NOTES" --prerelease
          else
            gh release create apk-latest narrhalla-player.apk --target "$GITHUB_SHA" \
              --title "Narrhalla Player – Android (Build ${{ github.run_number }})" --notes "$NOTES" --prerelease
          fi
